[project]
name = "job-helper-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipython>=9.17.1",
    "jupyterlab>=4.6.3",
    "jupyterlab-lsp>=5.3.0",
    "langchain>=1.4.2",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "langsmith>=0.13.0",
    "loguru>=0.7.3",
    "openai>=3.16.2",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-lsp-server>=1.15.0",
    "textract>=2.1.0",
    "typing-extensions>=4.16.0",
]

[project.scripts]
job-helper-agent = "job_helper_agent:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
